[project]
name = "asterix-gateway"
version = "0.1.0"
description = "A gateway for converting ADS-B messages to ASTERIX CAT021 format, supporting real-time aircraft surveillance data processing and integration."
authors = [
    {name = "Mikita Tsybulka",email = "nikita.tsybulka@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pymodes (>=2.21.1,<3.0.0)",
    "envsh (>=0.1.2,<0.2.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ruff = "^0.13.1"
pytest = "^8.4.2"

